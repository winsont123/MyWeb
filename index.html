<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winsont | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yanone+Kaffeesatz:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">
            <h1>My Portfolio</h1>
        </div>
        <div class="link">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#aboutMe">About Me</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#achievements">Achievements</a></li>
                <li><a href="#projects">Portfolio</a></li>
                <li><a href="#contactUs">Contact</a></li>
            </ul>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <header id="home">
        <div class="judul">
            <div class="atas">
                <h1></h1>
                <div class="ketik"></div>
            </div>
            <span>
                <p class="subtitle"></p>
            </span>
            <a href="#" class="btn-cv" target="_blank">Download CV</a>
        </div>
    </header>

    <section id="aboutMe" class="section-padding">
        <div class="isi">
            <div class="face">
                <img alt="Foto Profil">
            </div>
            <div class="konten">
                <h2>About Me</h2>
                <p class="about-desc"></p>
                <div class="education">
                    <h3>Education</h3>
                    <p class="edu-text"></p>
                </div>
            </div>
        </div>
    </section>

    <section id="experience" class="section-padding bg-alt">
        <div class="all">
            <h2>Experience & Volunteer</h2>
            <div class="timeline" id="experienceList"></div>
        </div>
    </section>

    <section id="achievements" class="section-padding">
        <div class="all">
            <h2>Achievements</h2>
            <div class="timeline" id="achievementsList"></div>
        </div>
    </section>

    <section id="projects" class="section-padding bg-alt">
        <div class="all">
            <h2>My Portfolio or Project</h2>
            <div class="konten" id="projectList"></div>
        </div>
    </section>

    <section id="skills" class="section-padding">
        <div class="all">
            <h2>Skills & Languages</h2>
            <div class="skills-container">
                <div class="skill-category">
                    <h3>Technical Skills</h3>
                    <div class="tags" id="techSkills"></div>
                </div>
                <div class="skill-category">
                    <h3>Languages</h3>
                    <div class="tags" id="langSkills"></div>
                </div>
            </div>
        </div>
    </section>

    <section id="contactUs" class="section-padding bg-alt">
        <div class="semua">
            <h2>Contact Me</h2>
            <p class="contact-sub">Let's build something cool together.</p>
            <div class="contact" id="contactList"></div>
        </div>
    </section>

    <footer>
        <div class="foot">
            <div class="logoFoot">
                <h3 id="footerName"></h3>
            </div>
            <ul id="footerCredits"></ul>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
